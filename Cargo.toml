[package]
name = "episode-splitter"
version = "1.0.0"
edition = "2021"
description = "Episode Part Splitter - native wrapper around the offline HTML tool"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
arboard = { version = "3.7.0", default-features = false }
serde_json = "1.0.154"
tao = "0.37.3"
wry = "0.57.3"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21.2"

[build-dependencies]
winresource = "0.1"
